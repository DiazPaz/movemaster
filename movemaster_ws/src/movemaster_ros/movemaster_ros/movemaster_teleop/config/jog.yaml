# jog_node: jogging from the teach pendant. Joint limits and order come from joints.json;
# the serial port is the launch argument port.
jog_node:
  ros__parameters:
    baudrate: 115200
    # What the ESP32 sends: text (hmi/esp32/main.cpp) or binary (firmware/, 8-byte frames).
    protocol: text
    angles_rate_hz: 10.0        # text only: measured angles sent back for the ESP32 to show
    rate_hz: 50.0               # same rate the ESP32 sends at
    # The pendant's button groups, as on its panel and in its firmware: the HMI shows them too.
    x_joints: [4, 5]            # joystick X: J4 and J5 buttons
    y_joints: [1, 2, 3]         # joystick Y: J1, J2 and J3 buttons
    # Speed at full joystick, joint_1..joint_5 (rad/s, with decimals). Capped at
    # max_velocity_rad_s of joints.json.
    max_speed_rad_s: [0.25, 0.25, 0.25, 0.25, 0.25]
    deadband: 0.12              # fraction of the joystick travel that does nothing
    max_lead_rad: 0.05          # how far a target may run ahead of the measured joint
    link_timeout_s: 0.2         # no frames for this long: stop jogging
    idle_timeout_s: 1.0         # after this long without motion, the next jog restarts
                                # from the measured positions
    # The pendant's MANUAL switch activates jog_controller; AUTO gives the joints back to
    # joint_trajectory_controller. false: switch them by hand with ros2 control.
    select_controllers: true
    switch_retry_s: 2.0         # wait after the controller_manager refuses a switch
