# Cinemática del MoveMaster en Denavit-Hartenberg estándar:
#
#   T(i-1 → i) = Rz(θi) · Tz(di) · Tx(ai) · Rx(αi),   con  θi = qi + theta_offset_deg
#
# qi es el ángulo de la articulación en ROS (joints.json, /joint_states, MoveIt). Los
# desfases hacen que qi = 0 en todos los ejes sea Home: el brazo vertical, con el faceplate
# hacia arriba y su marca hacia el frente (+x de base_link). Así, con el brazo encendido en
# Home, zero_offset_rad de joints.json es 0 en todos los ejes (MANUAL §4.4).
#
# Sentido positivo de qi: cintura y faceplate antihorario vistos desde arriba en Home;
# hombro, codo e inclinación de muñeca inclinan el brazo hacia adelante. Si un motor gira
# al revés, se corrige con direction en joints.json, no aquí.
#
# Longitudes en mm y ángulos en grados; el URDF los convierte a metros y radianes. El último
# marco, tool0, es el centro de la cara del faceplate (la brida), con z hacia fuera: ahí se
# montan las herramientas.
#
# joint             nombre del eje en joints.json y en el URDF
# label             nombre del eje en el brazo; da nombre a su eslabón (<label>_link)
# theta_offset_deg  θi cuando qi = 0
# home_deg          postura Home, en qi. Un eje que todavía no está en joints.json queda fijo aquí.
# radius_mm         radio aproximado del eslabón, para dibujarlo y para las colisiones
chain:
  - {joint: joint_1, label: waist,       a_mm: 0,     alpha_deg: -90, d_mm: 250, theta_offset_deg: 0,   home_deg: 0, radius_mm: 45}
  - {joint: joint_2, label: shoulder,    a_mm: 220,   alpha_deg: 0,   d_mm: 0,   theta_offset_deg: -90, home_deg: 0, radius_mm: 35}
  - {joint: joint_3, label: elbow,       a_mm: 157.4, alpha_deg: 0,   d_mm: 0,   theta_offset_deg: 0,   home_deg: 0, radius_mm: 30}
  - {joint: joint_4, label: wrist_pitch, a_mm: 0,     alpha_deg: -90, d_mm: 0,   theta_offset_deg: -90, home_deg: 0, radius_mm: 25}
  - {joint: joint_5, label: wrist_roll,  a_mm: 0,     alpha_deg: 0,   d_mm: 146, theta_offset_deg: 180, home_deg: 0, radius_mm: 20}

# Base fija bajo el eje 1, solo para dibujo y colisiones.
base: {radius_mm: 80, height_mm: 40}

# Solo para la vista previa (launch/display.launch.py), que mueve los cinco ejes: rango de
# los que aún no están en joints.json. No llega al hardware ni a MoveIt.
preview_limits_deg: [-180, 180]
