# Cinemática del MoveMaster en Denavit-Hartenberg estándar:
#
#   T(i-1 → i) = Rz(θi) · Tz(di) · Tx(ai) · Rx(αi)
#
# θi = qi + theta_offset_deg, donde qi es la posición del eje en ROS (joints.json,
# /joint_states, MoveIt). Los desfases hacen que q = 0 en todos los ejes sea Home: el brazo
# vertical, el antebrazo horizontal al frente y el faceplate hacia abajo, con su marca al frente.
# Ahí termina el homing. Con θ = 0 en todos (la pose cero DH, q = (0, 90°, −90°, 0, 0)) el brazo
# y el antebrazo quedan horizontales al frente.
#
# Sentido positivo: cintura antihorario vista desde arriba; hombro, codo e inclinación de
# muñeca inclinan el brazo hacia adelante; faceplate antihorario visto de frente. Si un motor
# gira al revés, se corrige con direction en joints.json, no aquí.
#
# Longitudes en mm y ángulos en grados; el URDF los convierte a metros y radianes. El último
# marco, tool0, es el centro de la cara del faceplate (la brida), con z hacia fuera: ahí se
# montan las herramientas.
#
# joint             nombre del eje en joints.json y en el URDF
# label             nombre del eje en el brazo; da nombre a su eslabón (<label>_link)
# theta_offset_deg  θ del eje con q = 0, es decir, en Home. Un eje que no está en joints.json
#                   queda fijo ahí.
# radius_mm         radio aproximado del eslabón, para dibujarlo y para las colisiones
chain:
  - {joint: joint_1, label: waist,       a_mm: 0,     alpha_deg: -90, d_mm: 250, theta_offset_deg: 0,   radius_mm: 45}
  - {joint: joint_2, label: shoulder,    a_mm: 220,   alpha_deg: 0,   d_mm: 0,   theta_offset_deg: -90, radius_mm: 35}
  - {joint: joint_3, label: elbow,       a_mm: 157.4, alpha_deg: 0,   d_mm: 0,   theta_offset_deg: 90,  radius_mm: 30}
  - {joint: joint_4, label: wrist_pitch, a_mm: 0,     alpha_deg: -90, d_mm: 0,   theta_offset_deg: 0,   radius_mm: 25}
  - {joint: joint_5, label: wrist_roll,  a_mm: 0,     alpha_deg: 0,   d_mm: 150, theta_offset_deg: 0,   radius_mm: 20}

# Base fija bajo el eje 1, solo para dibujo y colisiones.
base: {radius_mm: 80, height_mm: 40}
